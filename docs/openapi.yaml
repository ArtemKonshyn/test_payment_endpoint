openapi: 3.0.3
info:
  title: Payment API
  version: 1.0.0
  description: Starts card payments for shopping carts. Payments are charged in the background.

security:
  - bearerAuth: []

paths:
  /carts/{cart_id}/payments:
    post:
      summary: Start the payment for a cart
      description: |
        Creates a `pending` payment and hands it to the background worker.
        Poll `GET /payments/{payment_id}` (the `Location` header) for the result.
        The user's default card is charged.
        Sending the same `Idempotency-Key` again returns the existing payment.
      parameters:
        - $ref: "#/components/parameters/CartId"
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique key per payment attempt, chosen by the client. Unique per user.
          schema: {type: string, minLength: 1, maxLength: 255}
      responses:
        "202":
          description: Payment created and queued.
          headers:
            Location: {schema: {type: string}, description: URL of the payment}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Payment"}
        "200":
          description: The Idempotency-Key was already used for this cart. Returns that payment.
          headers:
            Location: {schema: {type: string}, description: URL of the payment}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Payment"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409":
          description: The cart is not active, it already has a payment in progress or completed, or the Idempotency-Key was used for another cart.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422":
          description: The cart is empty, or the user has no default payment method.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /payments/{payment_id}:
    get:
      summary: Get a payment of the current user
      parameters:
        - name: payment_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The payment.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Payment"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 token. The `sub` claim is the user id.

  parameters:
    CartId:
      name: cart_id
      in: path
      required: true
      schema: {type: string, format: uuid}

  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    Payment:
      type: object
      properties:
        id: {type: string, format: uuid}
        cart_id: {type: string, format: uuid}
        payment_method_id: {type: string, format: uuid}
        status: {type: string, enum: [pending, processing, succeeded, failed]}
        amount: {type: string, example: "70.00"}
        currency: {type: string, example: USD}
        failure_reason: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Error:
      type: object
      properties:
        error_message:
          oneOf:
            - type: string
            - type: object
              description: Field validation errors.
