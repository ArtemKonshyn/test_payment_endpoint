x-app: &app
  build: .
  image: payment-endpoint
  environment:
    DATABASE_URL: postgresql+psycopg://payments:payments@db:5432/payments
    REDIS_URL: redis://redis:6379/0
    JWT_SECRET_KEY: local-development-secret-change-me-in-production
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  migrate:
    <<: *app
    command: flask db upgrade
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: celery -A src.app.celery_app worker --loglevel=info

  beat:
    <<: *app
    command: celery -A src.app.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule

  tests:
    build:
      context: .
      args:
        REQUIREMENTS: requirements-test.txt
    image: payment-endpoint-tests
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://payments:payments@db:5432/payments_test
    command: pytest
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
